4E2A\u7C7B\u522B\u6700\u591A\u3002"},Git:{plain:"\u4EE3\u7801\u7684\u7248\u672C\u8BB0\u5F55\u5DE5\u5177\uFF1A\u80FD\u67E5\u770B\u6539\u4E86\u4EC0\u4E48\u3001\u6BD4\u8F83\u7248\u672C\u3001\u56DE\u5230\u67D0\u4E2A\u4FDD\u5B58\u70B9\u3002",example:"\u53D1\u73B0\u65B0\u63D0\u793A\u8BCD\u5BFC\u81F4\u56DE\u7B54\u53D8\u5DEE\uFF0C\u53EF\u4EE5\u627E\u5230\u4FEE\u6539\u8BB0\u5F55\u3002"},RAG:{plain:"\u68C0\u7D22\u589E\u5F3A\u751F\u6210\uFF1A\u5148\u627E\u76F8\u5173\u8D44\u6599\uFF0C\u518D\u8BA9\u6A21\u578B\u6839\u636E\u8FD9\u4E9B\u8D44\u6599\u56DE\u7B54\u3002\u4E2D\u6587\u53EF\u4EE5\u8BB0\u6210\u201C\u5148\u7FFB\u8D44\u6599\u518D\u56DE\u7B54\u201D\u3002",example:"\u5148\u627E\u5230\u672C\u5468\u6D3B\u52A8\u89C4\u5219\uFF0C\u518D\u56DE\u7B54\u5E97\u957F\u80FD\u5426\u53E0\u52A0\u4F18\u60E0\u3002"},Embedding:{plain:"\u628A\u6587\u5B57\u8F6C\u6362\u6210\u6570\u5B57\u5411\u91CF\uFF0C\u65B9\u4FBF\u6309\u542B\u4E49\u76F8\u8FD1\u7A0B\u5EA6\u67E5\u627E\u8D44\u6599\u3002\u5B83\u4E0D\u662F\u7406\u89E3\u8D28\u91CF\u7684\u4FDD\u8BC1\u3002",example:"\u201C\u80FD\u5426\u540C\u65F6\u4F7F\u7528\u5238\u201D\u548C\u201C\u4F18\u60E0\u662F\u5426\u53E0\u52A0\u201D\u53EF\u80FD\u88AB\u68C0\u7D22\u6210\u76F8\u8FD1\u95EE\u9898\u3002"},\u77E5\u8BC6\u5207\u5206:{plain:"\u628A\u957F\u6587\u6863\u5206\u6210\u53EF\u68C0\u7D22\u7684\u5C0F\u5757\uFF0C\u540C\u65F6\u4FDD\u7559\u6807\u9898\u3001\u65E5\u671F\u548C\u6765\u6E90\u3002",example:"\u628A\u6D3B\u52A8\u5BF9\u8C61\u3001\u4F7F\u7528\u9650\u5236\u548C\u9000\u6B3E\u6761\u6B3E\u5206\u5757\uFF0C\u4F46\u522B\u628A\u4F8B\u5916\u6761\u4EF6\u5207\u4E22\u3002"},\u91CD\u6392:{plain:"\u7B2C\u4E00\u8F6E\u627E\u51FA\u4E00\u4E9B\u5019\u9009\u8D44\u6599\u540E\uFF0C\u518D\u6309\u4E0E\u95EE\u9898\u7684\u76F8\u5173\u7A0B\u5EA6\u91CD\u65B0\u6392\u5E8F\u3002",example:"\u5148\u627E\u5230\u5341\u6BB5\u89C4\u5219\uFF0C\u518D\u628A\u672C\u5E97\u672C\u5468\u6709\u6548\u7684\u4E09\u6BB5\u653E\u524D\u9762\u3002"},\u7ED3\u6784\u5316\u8F93\u51FA:{plain:"\u8981\u6C42\u6A21\u578B\u6309
