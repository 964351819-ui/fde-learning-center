4E2A\u7C7B\u522B\u6700\u591A\u3002"},Git:{plain:"\u4EE3\u7801\u7684\u7248\u672C\u8BB0\u5F55\u5DE5\u5177\uFF1A\u80FD\u67E5\u770B\u6539\u4E86\u4EC0\u4E48\u3001\u6BD4\u8F83\u7248\u672C\u3001\u56DE\u5230\u67D0\u4E2A\u4FDD\u5B58\u70B9\u3002",example:"\u53D1\u73B0\u65B0\u63D0\u793A\u8BCD\u5BFC\u81F4\u56DE\u7B54\u53D8\u5DEE\uFF0C\u53EF\u4EE5\u627E\u5230\u4FEE\u6539\u8BB0\u5F55\u3002"},RAG:{plain:"\u68C0\u7D22\u589E\u5F3A\u751F\u6210\uFF1A\u5148\u627E\u76F8\u5173\u8D44\u6599\uFF0C\u518D\u8BA9\u6A21\u578B\u6839\u636E\u8FD9\u4E9B\u8D44\u6599\u56DE\u7B54\u3002\u4E2D\u6587\u53EF\u4EE5\u8BB0\u6210\u201C\u5148\u7FFB\u8D44\u6599\u518D\u56DE\u7B54\u201D\u3002",example:"\u5148\u627E\u5230\u672C\u5468\u6D3B\u52A8\u89C4\u5219\uFF0C\u518D\u56DE\u7B54\u5E97\u957F\u80FD\u5426\u53E0\u52A0\u4F18\u60E0\u3002"},Embedding:{plain:"\u628A\u6587\u5B57\u8F6C\u6362\u6210\u6570\u5B57\u5411\u91CF\uFF0C\u65B9\u4FBF\u6309\u542B\u4E49\u76F8\u8FD1\u7A0B\u5EA6\u67E5\u627E\u8D44\u6599\u3002\u5B83\u4E0D\u662F\u7406\u89E3\u8D28\u91CF\u7684\u4FDD\u8BC1\u3002",example:"\u201C\u80FD\u5426\u540C\u65F6\u4F7F\u7528\u5238\u201D\u548C\u201C\u4F18\u60E0\u662F\u5426\u53E0\u52A0\u201D\u53EF\u80FD\u88AB\u68C0\u7D22\u6210\u76F8\u8FD1\u95EE\u9898\u3002"},\u77E5\u8BC6\u5207\u5206:{plain:"\u628A\u957F\u6587\u6863\u5206\u6210\u53EF\u68C0\u7D22\u7684\u5C0F\u5757\uFF0C\u540C\u65F6\u4FDD\u7559\u6807\u9898\u3001\u65E5\u671F\u548C\u6765\u6E90\u3002",example:"\u628A\u6D3B\u52A8\u5BF9\u8C61\u3001\u4F7F\u7528\u9650\u5236\u548C\u9000\u6B3E\u6761\u6B3E\u5206\u5757\uFF0C\u4F46\u522B\u628A\u4F8B\u5916\u6761\u4EF6\u5207\u4E22\u3002"},\u91CD\u6392:{plain:"\u7B2C\u4E00\u8F6E\u627E\u51FA\u4E00\u4E9B\u5019\u9009\u8D44\u6599\u540E\uFF0C\u518D\u6309\u4E0E\u95EE\u9898\u7684\u76F8\u5173\u7A0B\u5EA6\u91CD\u65B0\u6392\u5E8F\u3002",example:"\u5148\u627E\u5230\u5341\u6BB5\u89C4\u5219\uFF0C\u518D\u628A\u672C\u5E97\u672C\u5468\u6709\u6548\u7684\u4E09\u6BB5\u653E\u524D\u9762\u3002"},\u7ED3\u6784\u5316\u8F93\u51FA:{plain:"\u8981\u6C42\u6A21\u578B\u6309 \u6B3E\u5EFA\u8BAE\u6D41\u7A0B\uFF1A\u67E5\u8BA2\u5355 \u2192 \u68C0\u67E5\u653F\u7B56 \u2192 \u751F\u6210\u4EBA\u5DE5\u5EFA\u8BAE \u2192 \u4E3B\u7BA1\u5BA1\u6279 \u2192 \u7CFB\u7EDF\u6267\u884C \u2192 \u6838\u5BF9\u7ED3\u679C\u3002",["\u5199\u51FA\u4EFB\u52A1\u5F00\u59CB\u548C\u5B8C\u6210\u7684\u6761\u4EF6\u3002","\u6309\u987A\u5E8F\u5217\u6B65\u9AA4\u3002","\u4E3A\u7F3A\u8D44\u6599\u3001\u5BA1\u6279\u62D2\u7EDD\u548C\u7CFB\u7EDF\u5931\u8D25\u5199\u5904\u7406\u5206\u652F\u3002"],"\u6B65\u9AA4\u8FDE\u6210\u4E00\u6761\u7EBF\u8FD8\u4E0D\u591F\uFF1B\u5931\u8D25\u6216\u7F3A\u4FE1\u606F\u65F6\u4E5F\u8981\u77E5\u9053\u4E0B\u4E00\u6B65\u3002","\u4E3B\u7BA1\u6CA1\u6709\u6279\u51C6\uFF0C\u6D41\u7A0B\u662F\u5426\u5E94\u8BE5\u7EE7\u7EED\u9000\u6B3E\uFF1F","\u4E0D\u5E94\u8BE5\u3002\u5BA1\u6279\u662F\u6267\u884C\u524D\u5FC5\u987B\u901A\u8FC7\u7684\u6761\u4EF6\u3002"],Agent:["\u4E00\u79CD\u80FD\u5728\u5141\u8BB8\u8303\u56F4\u5185\u81EA\u884C\u9009\u62E9\u4E0B\u4E00\u6B65\u3001\u8C03\u7528\u5DE5\u5177\u3001\u6839\u636E\u7ED3\u679C\u7EE7\u7EED\u5DE5\u4F5C\u7684 AI \u52A9\u624B\u3002","\u4F60\u4EA4\u7ED9\u52A9\u7406\u4E00\u4E2A\u76EE\u6807\uFF0C\u5B83\u51B3\u5B9A\u5148\u67E5\u54EA\u4E2A\u8D44\u6599\uFF1B\u9047\u5230\u6CA1\u6709\u6743\u9650\u7684\u4E8B\u60C5\u4ECD\u9700\u8BF7\u793A\u3002","\u4E3A\u987E\u5BA2\u95EE\u9898\u67E5\u6D3B\u52A8\u89C4\u5219\u65F6\uFF0C\u52A9\u624B\u53EF\u80FD\u5148\u8FFD\u95EE\u95E8\u5E97\uFF0C\u518D\u67E5\u5BF9\u5E94\u89C4\u5219\uFF0C\u6700\u540E\u7EC4\u7EC7\u7B54\u590D\u3002",["\u5148\u7ED9\u76EE\u6807\u548C\u5141\u8BB8\u505A\u7684\u52A8\u4F5C\u3002","\u5B83\u6839\u636E\u5DF2\u6709\u4FE1\u606F\u9009\u62E9\u4E0B\u4E00\u6B65\u3002","\u6BCF\u6B21\u52A8\u4F5C\u7531\u7CFB\u7EDF\u6838\u5BF9\u6743\u9650\u548C\u8303\u56F4\u3002","\u4EFB\u52A1\u5B8C\u6210\u3001\u5931\u8D25\u6216\u8FBE\u5230\u9650\u5236\u65F6\u505C\u6B62\u3002"],"\u81EA\u4E3B\u51B3\u5B9A\u4E0B\u4E00\u6B65\u4E0D\u7B49\u4E8E\u53EF\u4EE5\u4EFB\u610F\u4ED8\u6B3E\u3001\u9000\u6B3E\u6216\u8BFB\u53D6\u6240\u6709\u8D44\u6599\u3002","Agent \u627E\u4E0D\u5230\u89C4\u5219\uFF0C\u80FD\u81EA\u884C\u521B\u9020\u4E00\u6761\u5417\uFF1F","\u4E0D\u80FD\u3002\u5E94\u8BE5\u8BF4\u660E\u7F3A\u8D44\u6599\u3001\u8FFD\u95EE\u6216\u8F6C\u4EBA\u5DE5\u3002"],\u5E42\u7B49:["\u540C\u4E00\u4EF6\u64CD\u4F5C\u56E0\u4E3A\u91CD\u8BD5\u88AB\u53D1\u9001\u591A\u6B21\uFF0C\u4E1A\u52A1\u7ED3\u679C\u4ECD\u53EA\u53D1\u751F\u4E00\u6B21\u3002","\u987E\u5BA2\u4E0D\u8010\u70E6\u8FDE\u7EED\u6309\u4E09\u6B21\u4ED8\u6B3E\u6309\u94AE\uFF0C\u4E0D\u5E94\u8BE5\u56E0\u6B64\u88AB\u6263\u4E09\u6B21\u94B1\u3002","\u9000\u6B3E\u8BF7\u6C42\u53D1\u51FA\u540E\u7F51\u7EDC\u8D85\u65F6\uFF0C\u7A0B\u5E8F\u4E0D\u77E5\u9053\u662F\u5426\u6210\u529F\u3002\u518D\u6B21\u63D0\u4EA4\u540C\u4E00\u7533\u8BF7\u65F6\uFF0C\u7CFB\u7EDF\u8BC6\u522B\u5B83\u5DF2\u7ECF\u5904\u7406\u8FC7\uFF0C\u4E0D\u518D\u9000\u7B2C\u4E8C\u6B21\u94B1\u3002",["\u7ED9\u8FD9\u4E00\u6B21\u9000\u6B3E\u7533\u8BF7\u4E00\u4E2A\u56FA\u5B9A\u7684\u8BC6\u522B\u6807\u8BB0\u3002","\u7CFB\u7EDF\u4FDD\u5B58\u8BE5\u7533\u8BF7\u662F\u5426\u5DF2\u5904\u7406\u53CA\u7ED3\u679C\u3002","\u91CD\u8BD5\u4F7F\u7528\u540C\u4E00\u6807\u8BB0\uFF0C\u5148\u67E5\u65E7\u7ED3\u679C\uFF0C\u907F\u514D\u91CD\u590D\u64CD\u4F5C\u3002","\u53E6\u4E00\u7B14\u6216\u53E6\u4E00\u91D1\u989D\u7684\u9000\u6B3E\u4E0D\u80FD\u5192\u7528\u65E7\u6807\u8BB0\u3002"],"\u8D85\u65F6\u53EA\u8868\u793A\u6CA1\u6309\u65F6\u6536\u5230\u56DE\u590D\uFF0C\u4E0D\u80FD\u76F4\u63A5\u65AD\u5B9A\u9000\u6B3E\u6CA1\u6709\u53D1\u751F\u3002","\u9000\u6B3E\u8D85\u65F6\u540E\u7ACB\u523B\u518D\u9000\u4E00\u7B14\uFF0C\u4E3A\u4EC0\u4E48\u5371\u9669\uFF1F","\u7B2C\u4E00\u6B21\u53EF\u80FD\u5DF2\u7ECF\u6210\u529F\uFF0C\u4F1A\u9020\u6210\u91CD\u590D\u9000\u6B3E\uFF1B\u5148\u67E5\u8BE2\u5B9E\u9645\u7ED3\u679C\uFF0C\u5E76\u6309\u7CFB\u7EDF\u7684\u91CD\u590D\u8BF7\u6C42\u89C4\u5219\u5904\u7406\u3002"],\u8BC4\u4F30:["\u5148\u8BF4\u660E\u600E\u6837\u624D\u7B97\u505A\u597D\uFF0C\u518D\u62FF\u4E00\u7EC4\u4EFB\u52A1\u53CD\u590D\u68C0\u67E5\uFF0C\u8BB0\u5F55\u54EA\u4E9B\u901A\u8FC7\u3001\u54EA\u4E9B\u6CA1\u901A\u8FC7\u3002","\u68C0\u67E5\u996E\u54C1\u65F6\u63D0\u524D\u7EA6\u5B9A\u751C\u5EA6\u3001\u6E29\u5EA6\u3001\u51FA\u676F\u65F6\u95F4\uFF0C\u800C\u4E0D\u662F\u559D\u4E00\u53E3\u53EA\u8BF4\u201C\u611F\u89C9\u633A\u597D\u201D\u3002","\u4F18\u60E0\u9898\u5FC5\u987B\u56DE\u7B54\u4E0D\u80FD\u53E0\u52A0\u5E76\u7ED9\u4F9D\u636E\uFF1B\u9000\u6B3E\u9898\u6CA1\u6709\u653F\u7B56\u65F6\u4E0D\u80FD\u627F\u8BFA\u9000\u6B3E\u3002\u4E24\u7C7B\u9898\u7684\u901A\u8FC7\u6807\u51C6\u4E0D\u540C\u3002",["\u5148\u6309\u4EFB\u52A1\u7C7B\u578B\u5199\u901A\u8FC7\u6761\u4EF6\u3002","\u51C6\u5907\u6B63\u5E38\u3001\u7F3A\u4FE1\u606F\u548C\u4E0D\u80FD\u6267\u884C\u7684\u9898\u3002","\u9010\u9898\u68C0\u67E5\uFF0C\u5355\u72EC\u8BB0\u5F55\u4E25\u91CD\u9519\u8BEF\u3002","\u6539\u8FDB\u540E\u518D\u8FD0\u884C\u540C\u4E00\u7EC4\u9898\u6BD4\u8F83\u3002"],"\u603B\u4F53\u7B54\u5BF9\u5F88\u591A\u9898\uFF0C\u4E5F\u4E0D\u80FD\u628A\u4E00\u6B21\u672A\u7ECF\u6388\u6743\u9000\u6B3E\u85CF\u5728\u5E73\u5747\u5206\u91CC\u3002","\u4E8C\u5341\u9898\u7B54\u5BF9\u5341\u4E03\u9898\uFF0C\u80FD\u76F4\u63A5\u5141\u8BB8\u81EA\u52A8\u9000\u6B3E\u5417\uFF1F","\u4E0D\u80FD\u3002\u8981\u5148\u68C0\u67E5\u4E09\u9053\u5931\u8D25\u9898\uFF0C\u8D44\u91D1\u6216\u6743\u9650\u9519\u8BEF\u5FC5\u987B\u5355\u72EC\u5904\u7406\u3002"],\u9EC4\u91D1\u6837\u672C:["\u7ECF\u8FC7\u4E1A\u52A1\u4EBA\u5458\u786E\u8BA4\uFF0C\u53EF\u4EE5\u53CD\u590D\u7528\u6765\u68C0\u67E5\u7CFB\u7EDF\u7684\u4E00\u7EC4\u53C2\u8003\u9898\u548C\u6B63\u786E\u5904\u7406\u8981\u6C42\u3002","\u8001\u5E08\u51FA\u7684\u7EC3\u4E60\u9898\u9644\u6709\u8BC4\u5206\u8981\u70B9\uFF1B\u7B54\u6848\u8868\u8FF0\u53EF\u4EE5\u4E0D\u540C\uFF0C\u4F46\u5173\u952E\u6761\u4EF6\u5FC5\u987B\u5BF9\u3002","\u9898\u76EE\uFF1A\u4E00\u53F7\u95E8\u5E97\u5341\u6708\u5238\u80FD\u53E0\u52A0\u5417\uFF1F\u8BC4\u5206\u8981\u70B9\uFF1A\u4E0D\u80FD\u53E0\u52A0\u3001\u89C4\u5219\u9002\u7528\u3001\u8BF4\u660E\u6765\u6E90\u3002",["\u8BB0\u5F55\u5B8C\u6574\u95EE\u9898\u4E0E\u9002\u7528\u95E8\u5E97\u3001\u65E5\u671F\u3002","\u7531\u4E1A\u52A1\u8D1F\u8D23\u4EBA\u786E\u8BA4\u5E94\u6709\u7ED3\u8BBA\u548C\u4F9D\u636E\u3002","\u5199\u6E05\u5FC5\u987B\u5305\u542B\u548C\u4E0D\u80FD\u51FA\u73B0\u7684\u5185\u5BB9\u3002","\u4FDD\u7559\u8FD9\u4E9B\u9898\uFF0C\u6539\u7A0B\u5E8F\u540E\u518D\u6B21\u68C0\u67E5\u3002"],"\u201C\u9EC4\u91D1\u201D\u4E0D\u662F\u6C38\u8FDC\u4E0D\u53D8\uFF1B\u4E1A\u52A1\u89C4\u5219\u6539\u4E86\uFF0C\u53C2\u8003\u8981\u6C42\u4E5F\u8981\u7ECF\u8FC7\u786E\u8BA4\u540E\u66F4\u65B0\u3002","\u89C4\u5219\u91CC\u6CA1\u6709\u9000\u6B3E\u6761\u6B3E\uFF0C\u53C2\u8003\u9898\u7684\u6B63\u786E\u8981\u6C42\u662F\u4EC0\u4E48\uFF1F","\u8BF4\u660E\u4F9D\u636E\u4E0D\u8DB3\uFF0C\u8865\u5145\u5FC5\u8981\u4FE1\u606F\u6216\u4EA4\u8D1F\u8D23\u4EBA\u5458\u5904\u7406\uFF0C\u800C\u4E0D\u662F\u7F16\u51FA\u9000\u6B3E\u627F\u8BFA\u3002"],\u89C2\u6D4B:["\u7559\u4E0B\u7CFB\u7EDF\u5904\u7406\u4EFB\u52A1\u7684\u8FC7\u7A0B\u8BB0\u5F55\uFF0C\u8BA9\u4F60\u80FD\u770B\u51FA\u5B83\u5728\u54EA\u4E00\u6B65\u6162\u4E86\u6216\u9519\u4E86\u3002","\u67E5\u4E00\u4EFD\u8BA2\u5355\u7684\u5236\u4F5C\u3001\u53D6\u9910\u3001\u914D\u9001\u65F6\u95F4\uFF0C\u624D\u80FD\u77E5\u9053\u5230\u5E95\u5835\u5728\u54EA\u4E00\u6B65\u3002","\u4F18\u60E0\u7B54\u9519\u65F6\u67E5\u770B\u8BB0\u5F55\uFF1A\u95EE\u9898\u662F\u4EC0\u4E48\u3001\u67E5\u4E86\u54EA\u4EFD\u89C4\u5219\u3001\u6A21\u578B\u7B54\u4E86\u4EC0\u4E48\u3001\u5E97\u957F\u6539\u4E86\u591A\u4E45\u3002",["\u628A\u4E00\u6B21\u4EFB\u52A1\u7684\u5173\u952E\u6B65\u9AA4\u8FDE\u6210\u8BB0\u5F55\u3002","\u8BB0\u5F55\u8D44\u6599\u6765\u6E90\u3001\u7528\u65F6\u548C\u9519\u8BEF\uFF1B\u907F\u514D\u8BB0\u5F55\u4E0D\u5FC5\u8981\u7684\u4E2A\u4EBA\u4FE1\u606F\u3002","\u6CBF\u8FC7\u7A0B\u627E\u5230\u5F02\u5E38\u4F4D\u7F6E\uFF0C\u518D\u51B3\u5B9A\u6539\u54EA\u91CC\u3002"],"\u53EA\u8BB0\u5F55\u6700\u7EC8\u4E00\u53E5\u7B54\u590D\uFF0C\u5F80\u5F80\u770B\u4E0D\u51FA\u7528\u4E86\u65E7\u8D44\u6599\u8FD8\u662F\u7528\u6237\u7F3A\u4FE1\u606F\u3002","\u53EA\u77E5\u9053\u201C\u56DE\u7B54\u9519\u8BEF\u201D\uFF0C\u80FD\u786E\u5B9A\u662F\u54EA\u4E2A\u73AF\u8282\u51FA\u9519\u5417\uFF1F","\u901A\u5E38\u4E0D\u80FD\u3002\u8FD8\u9700\u8981\u770B\u5230\u8F93\u5165\u3001\u8D44\u6599\u3001\u751F\u6210\u548C\u4EBA\u5DE5\u5904\u7406\u7684\u8FC7\u7A0B\u3002"],ROI:["\u7528\u660E\u786E\u7684\u6536\u76CA\u4E0E\u6295\u5165\uFF0C\u6BD4\u8F83\u4E00\u9879\u6295\u8D44\u503C\u4E0D\u503C\u5F97\u3002\u5E38\u89C1\u7B97\u6CD5\u662F\u201C\u6536\u76CA\u51CF\u6295\u5165\uFF0C\u518D\u9664\u4EE5\u6295\u5165\u201D\u3002","\u82B1\u94B1\u6362\u8BBE\u5907\uFF0C\u8981\u68C0\u67E5\u5B83\u5E26\u6765\u7684\u65B0\u589E\u6536\u5165\u6216\u5B9E\u9645\u51CF\u5C11\u7684\u6210\u672C\uFF0C\u662F\u5426\u8D85\u8FC7\u82B1\u51FA\u53BB\u7684\u94B1\u3002","\u82E5\u4E00\u6B21\u9879\u76EE\u6295\u5165\u4E00\u4E07\u5143\uFF0C\u6309\u7EA6\u5B9A\u671F\u95F4\u786E\u8BA4\u6536\u76CA\u4E00\u4E07\u4E94\u5343\u5143\uFF0C\u51C0\u6536\u76CA\u4E94\u5343\u5143\uFF0CROI \u4E3A 50%\u3002\u8FD9\u662F\u6559\u5B66\u7B97\u4F8B\u3002",["\u5148\u56FA\u5B9A\u671F\u95F4\uFF0C\u4F8B\u5982\u534A\u5E74\u3002","\u5217\u6295\u5165\uFF1A\u5F00\u53D1\u3001\u5DE5\u5177\u3001\u7EF4\u62A4\u7B49\u3002","\u786E\u8BA4\u6536\u76CA\u662F\u5426\u771F\u5B9E\u5B9E\u73B0\uFF0C\u800C\u4E0D\u662F\u53EA\u628A\u7701\u4E0B\u7684\u5206\u949F\u5F53\u6210\u73B0\u91D1\u3002","\u6309\u4E00\u81F4\u53E3\u5F84\u8BA1\u7B97\u5E76\u8BF4\u660E\u5C1A\u672A\u9A8C\u8BC1\u7684\u5047\u8BBE\u3002"],"\u8282\u7EA6\u5DE5\u65F6\u4E0D\u81EA\u52A8\u7B49\u4E8E\u516C\u53F8\u5B9E\u9645\u8282\u7EA6\u4E86\u5DE5\u8D44\u652F\u51FA\u3002","\u6BCF\u5929\u5C11\u82B1\u5341\u5206\u949F\uFF0C\u5C31\u80FD\u76F4\u63A5\u8BF4\u516C\u53F8\u5C11\u53D1\u4E86\u5DE5\u8D44\u5417\uFF1F","\u4E0D\u80FD\u3002\u8981\u770B\u8FD9\u6BB5\u65F6\u95F4\u5982\u4F55\u4F7F\u7528\u3001\u662F\u5426\u5E26\u6765\u53EF\u786E\u8BA4\u7684\u6536\u5165\u6216\u6210\u672C\u53D8\u5316\u3002"],OPC:["\u672C\u8BFE\u7A0B\u6307\u4E00\u4E2A\u4EBA\u7ECF\u8425\u4E1A\u52A1\uFF0C\u 2A\u8BC4\u5206\u5417\uFF1F","\u5E94\u5148\u8C03\u67E5\u8BC4\u5206\u4E3A\u4EC0\u4E48\u4E0E\u4E1A\u52A1\u8981\u6C42\u4E0D\u4E00\u81F4\uFF0C\u8C03\u6574\u540E\u518D\u6BD4\u8F83\u3002"],ragas:["\u4E00\u79CD\u7528\u6765\u68C0\u67E5\u201C\u5148\u67E5\u8D44\u6599\u518D\u56DE\u7B54\u201D\u8FD9\u7C7B\u7CFB\u7EDF\u6548\u679C\u7684\u5DE5\u5177\uFF0C\u5E2E\u52A9\u5206\u5F00\u770B\u8D44\u6599\u627E\u5F97\u600E\u6837\u3001\u56DE\u7B54\u5199\u5F97\u600E\u6837\u3002","\u5F00\u5377\u8003\u8BD5\u65E2\u770B\u6709\u6CA1\u6709\u7FFB\u5230\u6B63\u786E\u6559\u6750\uFF0C\u4E5F\u770B\u7B54\u6848\u662F\u5426\u4F9D\u636E\u6559\u6750\u3002","\u4F18\u60E0\u7B54\u9519\u53EF\u80FD\u662F\u6CA1\u627E\u5230\u5341\u6708\u89C4\u5219\uFF0C\u4E5F\u53EF\u80FD\u627E\u5230\u89C4\u5219\u540E\u6A21\u578B\u4ECD\u5199\u9519\uFF1B\u8FD9\u4E24\u7C7B\u539F\u56E0\u8981\u5206\u522B\u68C0\u67E5\u3002",["\u786E\u8BA4\u672C\u9898\u5E94\u53C2\u8003\u54EA\u4EFD\u89C4\u5219\u3002","\u68C0\u67E5\u5B9E\u9645\u627E\u5230\u7684\u8D44\u6599\u662F\u5426\u6B63\u786E\u3002","\u68C0\u67E5\u7B54\u590D\u662F\u5426\u4E0E\u627E\u5230\u7684\u8D44\u6599\u4E00\u81F4\u3002"],"\u4E00\u4E2A\u603B\u5206\u4E0D\u80FD\u89E3\u91CA\u6BCF\u4E2A\u5177\u4F53\u9519\u8BEF\uFF0C\u8981\u56DE\u5230\u5B9E\u9645\u9898\u76EE\u548C\u8D44\u6599\u3002","\u627E\u5230\u4E86\u6B63\u786E\u89C4\u5219\uFF0C\u56DE\u7B54\u5374\u76F8\u53CD\uFF0C\u4E3B\u8981\u8BE5\u67E5\u641C\u7D22\u8FD8\u662F\u56DE\u7B54\u73AF\u8282\uFF1F","\u9996\u5148\u68C0\u67E5\u751F\u6210\u56DE\u7B54\u73AF\u8282\uFF0C\u540C\u65F6\u4FDD\u7559\u8F93\u5165\u8D44\u6599\u8BC1\u636E\u3002"],Docker:["\u628A\u7A0B\u5E8F\u548C\u8FD0\u884C\u6240\u9700\u7684\u8F6F\u4EF6\u73AF\u5883\u4E00\u8D77\u88C5\u8FDB\u4E00\u4E2A\u53EF\u91CD\u590D\u4F7F\u7528\u7684\u8FD0\u884C\u5305\u7684\u5DE5\u5177\u3002","\u628A\u5DE5\u4F5C\u6240\u9700\u7684\u8BBE\u5907\u4E0E\u914D\u4EF6\u88C5\u5728\u540C\u4E00\u4E2A\u7BB1\u5B50\u91CC\uFF0C\u5230\u522B\u7684\u5730\u65B9\u5C3D\u91CF\u6309\u540C\u6837\u6761\u4EF6\u542F\u52A8\u3002","\u628A\u6D3B\u52A8\u52A9\u624B\u53CA\u6240\u9700\u8F6F\u4EF6\u6253\u5305\uFF0C\u65B9\u4FBF\u6D4B\u8BD5\u673A\u5668\u548C\u4E0A\u7EBF\u673A\u5668\u4F7F\u7528\u76F8\u8FD1\u7684\u73AF\u5883\u3002",["\u5217\u51FA\u7A0B\u5E8F\u9700\u8981\u7684\u8F6F\u4EF6\u3002","\u5236\u4F5C\u8FD0\u884C\u5305\uFF0C\u5728\u53E6\u4E00\u73AF\u5883\u542F\u52A8\u68C0\u67E5\u3002","\u53E6\u884C\u5B89\u6392\u8D26\u53F7\u3001\u8D44\u6599\u5B58\u50A8\u548C\u5907\u4EFD\u3002"],"\u8FD0\u884C\u5305\u4E0D\u81EA\u52A8\u4FDD\u5B58\u6240\u6709\u4E1A\u52A1\u6570\u636E\uFF0C\u4E5F\u4E0D\u4F1A\u81EA\u52A8\u914D\u597D\u6743\u9650\u3002","\u6709 Docker \u5305\uFF0C\u6362\u670D\u52A1\u5668\u5C31\u4E0D\u9700\u8981\u7BA1\u6570\u636E\u5E93\u4E86\u5417\uFF1F","\u4ECD\u9700\u8981\u3002\u7A0B\u5E8F\u8FD0\u884C\u73AF\u5883\u548C\u4E1A\u52A1\u6570\u636E\u5B58\u50A8\u662F\u4E0D\u540C\u90E8\u5206\u3002"],\u56DE\u6EDA:["\u65B0\u7248\u51FA\u4E86\u95EE\u9898\u65F6\uFF0C\u628A\u8FD0\u884C\u670D\u52A1\u6062\u590D\u5230\u4E8B\u5148\u786E\u8BA4\u53EF\u7528\u7684\u7248\u672C\u3002","\u65B0\u83DC\u5355\u4E0A\u7EBF\u51FA\u9519\uFF0C\u6309\u9884\u6848\u6062\u590D\u53EF\u7528\u7684\u70B9\u5355\u6D41\u7A0B\uFF0C\u5148\u8BA9\u95E8\u5E97\u6B63\u5E38\u8425\u4E1A\uFF0C\u518D\u4FEE\u95EE\u9898\u3002","\u65B0\u7248\u52A9\u624B\u4F1A\u6F0F\u6389\u4F18\u60E0\u6761\u4EF6\uFF0C\u5148\u6062\u590D\u5DF2\u6D4B\u8BD5\u7684\u4EE3\u7801\u4E0E\u914D\u7F6E\uFF0C\u518D\u68C0\u67E5\u95EE\u9898\u3002\u5F53\u524D\u6709\u6548\u653F\u7B56\u4ECD\u5FC5\u987B\u6B63\u786E\u63D0\u4F9B\u3002",["\u53D1\u5E03\u524D\u4FDD\u7559\u5DF2\u9A8C\u8BC1\u7248\u672C\u548C\u6062\u590D\u6B65\u9AA4\u3002","\u51FA\u73B0\u4E25\u91CD\u95EE\u9898\u65F6\u6309\u6B65\u9AA4\u6062\u590D\u3002","\u6062\u590D\u540E\u518D\u8DD1\u5173\u952E\u9898\uFF0C\u786E\u8BA4\u4E0D\u662F\u53EA\u6362\u4E86\u6587\u4EF6\u5374\u4ECD\u7B54\u9519\u3002"],"\u6062\u590D\u4EE3\u7801\u4E0D\u80FD\u628A\u8FC7\u671F\u4E1A\u52A1\u653F\u7B56\u5F53\u6210\u4ECA\u5929\u7684\u653F\u7B56\u3002","\u65E7\u4EE3\u7801\u80FD\u8FD0\u884C\uFF0C\u4F46\u5E26\u4E5D\u6708\u65E7\u89C4\u5219\uFF0C\u53EF\u4EE5\u76F4\u63A5\u7528\u6765\u7B54\u5341\u6708\u4F18\u60E0\u5417\uFF1F","\u4E0D\u80FD\u3002\u8FD0\u884C\u6062\u590D\u548C\u4E1A\u52A1\u8D44\u6599\u6709\u6548\u6027\u90FD\u8981\u68C0\u67E5\u3002"],\u91C7\u7EB3\u7387:["\u672C\u6765\u9002\u5408\u7528\u52A9\u624B\u5B8C\u6210\u7684\u4EFB\u52A1\u4E2D\uFF0C\u5B9E\u9645\u6709\u591A\u5C11\u7528\u4E86\u52A9\u624B\u3002","\u4E00\u767E\u4F4D\u7B26\u5408\u6761\u4EF6\u7684\u987E\u5BA2\u4E2D\u516D\u5341\u4F4D\u7528\u4E86\u81EA\u52A9\u70B9\u5355\uFF0C\u4F7F\u7528\u6BD4\u4F8B\u5C31\u662F 60%\u3002","\u4E00\u5468\u6709\u4E00\u767E\u6761\u9002\u5408\u6D3B\u52A8\u52A9\u624B\u7684\u54A8\u8BE2\uFF0C\u516D\u5341\u6761\u7528\u4E86\u52A9\u624B\uFF0C\u4EFB\u52A1\u91C7\u7EB3\u7387\u662F\u516D\u5341\u9664\u4EE5\u4E00\u767E\uFF0C\u5373 60%\u3002",["\u5148\u6570\u9002\u5408\u7528\u52A9\u624B\u7684\u4EFB\u52A1\uFF0C\u5171\u4E00\u767E\u6761\u3002","\u518D\u6570\u5B9E\u9645\u7528\u4E86\u52A9\u624B\u7684\u4EFB\u52A1\uFF0C\u5171\u516D\u5341\u6761\u3002","\u7528\u516D\u5341\u9664\u4EE5\u4E00\u767E\uFF0C\u5E76\u6CE8\u660E\u7EDF\u8BA1\u7684\u662F\u540C\u4E00\u5468\u3002"],"\u6CE8\u518C\u8FC7\u8D26\u53F7\u3001\u6253\u5F00\u8FC7\u9875\u9762\uFF0C\u4E0D\u7B49\u4E8E\u5728\u5B9E\u9645\u4EFB\u52A1\u4E2D\u4F7F\u7528\u8FC7\u3002","\u516D\u5341\u6B21\u4F7F\u7528\u4E2D\u56DB\u5341\u4E94\u6B21\u6210\u529F\uFF0C45\xF760 \u7B97\u7684\u662F\u91C7\u7EB3\u7387\u5417\uFF1F","\u4E0D\u662F\u3002\u5B83\u7B97\u7684\u662F\u5DF2\u7ECF\u4F7F\u7528\u52A9\u624B\u7684\u4EFB\u52A1\u6210\u529F\u7387\uFF1B\u91C7\u7EB3\u7387\u662F 60\xF7100\u3002"],\u5355\u4F4D\u7ECF\u6D4E:["\u5355\u72EC\u770B\u4E00\u7B14\u670D\u52A1\u6216\u4E00\u4E2A\u5BA2\u6237\uFF1A\u6536\u5230\u591A\u5C11\u94B1\uFF0C\u4E3A\u5B83\u82B1\u4E86\u591A\u5C11\u94B1\uFF0C\u8FD8\u5269\u591A\u5C11\u3002","\u5356\u4E00\u676F\u996E\u54C1\uFF0C\u4E0D\u80FD\u53EA\u770B\u552E\u4EF7\uFF0C\u8FD8\u8981\u6263\u539F\u6599\u3001\u5236\u4F5C\u548C\u5305\u88C5\u7B
